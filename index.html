<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้กินอะไรดี? 🍲</title>
    <style>
        /* ตกแต่งหน้าตาเว็บสไตล์มินิมอลพาสเทล */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 24px;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            color: #ff7675;
            min-height: 48px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #74b9ff;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(116, 185, 255, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        /* เอฟเฟกต์หมุนตอนสุ่ม */
        .rolling {
            animation: bounce 0.1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>วันนี้กินอะไรดี? 🤔</h1>
        <div id="result">กดปุ่มด้านล่างเพื่อสุ่มเมนู</div>
        <button onclick="randomFood()">สุ่มเลย!</button>
    </div>

    <script>
        // รายการอาหารที่ต้องการสุ่ม
        const foods = [
            "กะเพราไข่ดาว 🍳",
            "ส้มตำไก่ย่าง 🍗",
            "ชาบู/หมูกระทะ 🥓",
            "ก๋วยเตี๋ยวเรือเส้นเล็ก 🍜",
            "ข้าวผัดอเมริกัน 🍛",
            "ซูชิ 🍣",
            "สเต็กไก่พริกไทยดำ 🥩",
            "ข้าวมันไก่ผสม 🐔",
            "สลัดผักเพื่อสุขภาพ 🥗"
        ];

        function randomFood() {
            const resultDiv = document.getElementById('result');
            const button = document.querySelector('button');
            
            // ปิดการคลิกชั่วคราวขณะสุ่ม
            button.disabled = true;
            resultDiv.classList.add('rolling');
            
            let count = 0;
            // ทำแอนิเมชันสลับสุ่มเมนูเร็ว ๆ ก่อนหยุด
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * foods.length);
                resultDiv.innerText = foods[tempIndex];
                count++;
                
                if (count > 15) {
                    clearInterval(interval);
                    // สุ่มจริงครั้งสุดท้าย
                    const finalIndex = Math.floor(Math.random() * foods.length);
                    resultDiv.innerText = foods[finalIndex];
                    resultDiv.classList.remove('rolling');
                    button.disabled = false;
                }
            }, 100);
        }
    </script>
</body>
</html>
