<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's for Lunch? 🍲</title>
    <style>
        /* Elegant pastel minimal design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 24px;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            color: #ff7675;
            min-height: 48px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #74b9ff;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(116, 185, 255, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Bounce animation while rolling */
        .rolling {
            animation: bounce 0.1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>What's for Lunch? 🤔</h1>
        <div id="result">Click the button below to decide</div>
        <button onclick="randomFood()">Let's Spin!</button>
    </div>

    <script>
        // List of international and local menu choices
        const foods = [
            "Basil Chicken with Fried Egg 🍳",
            "Papaya Salad with Grilled Chicken 🍗",
            "Shabu-Shabu / Hotpot 🥓",
            "Boat Noodles with Beef/Pork 🍜",
            "American Fried Rice 🍛",
            "Sushi Platter 🍣",
            "Black Pepper Chicken Steak 🥩",
            "Hainanese Chicken Rice 🐔",
            "Healthy Caesar Salad 🥗"
        ];

        function randomFood() {
            const resultDiv = document.getElementById('result');
            const button = document.querySelector('button');
            
            button.disabled = true;
            resultDiv.classList.add('rolling');
            
            let count = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * foods.length);
                resultDiv.innerText = foods[tempIndex];
                count++;
                
                if (count > 15) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * foods.length);
                    resultDiv.innerText = foods[finalIndex];
                    resultDiv.classList.remove('rolling');
                    button.disabled = false;
                }
            }, 100);
        }
    </script>
</body>
</html>
